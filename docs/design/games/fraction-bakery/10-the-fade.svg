<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="850" viewBox="0 0 1800 850"><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#263238"/></marker><marker id="arrow-brass" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9c7414"/></marker><marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8790"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fbf6b"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0473a"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffae3b"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16786e"/></marker><linearGradient id="sky-night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2b5a"/><stop offset="0.45" stop-color="#3b3f86"/><stop offset="0.75" stop-color="#7a5c9e"/><stop offset="1" stop-color="#e9a77a"/></linearGradient><linearGradient id="sky-deep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141d40"/><stop offset="1" stop-color="#25306a"/></linearGradient><linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="0.5" stop-color="#e2b23c"/><stop offset="1" stop-color="#9c7414"/></linearGradient><linearGradient id="blade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3f6"/><stop offset="0.6" stop-color="#c9d3da"/><stop offset="1" stop-color="#7e8c95"/></linearGradient><linearGradient id="counter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c48a56"/><stop offset="1" stop-color="#8f5b30"/></linearGradient><linearGradient id="floor-in" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9d3b0"/><stop offset="1" stop-color="#c9a87c"/></linearGradient><linearGradient id="wall-in" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4e0"/><stop offset="1" stop-color="#f2dcb6"/></linearGradient><radialGradient id="glow-warm"><stop offset="0" stop-color="#ffd58a" stop-opacity="0.95"/><stop offset="1" stop-color="#ffd58a" stop-opacity="0"/></radialGradient><radialGradient id="glow-fire"><stop offset="0" stop-color="#ffb347" stop-opacity="0.95"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient><radialGradient id="glow-lit"><stop offset="0" stop-color="#fff3b0" stop-opacity="0.95"/><stop offset="1" stop-color="#fff3b0" stop-opacity="0"/></radialGradient><radialGradient id="glow-green"><stop offset="0" stop-color="#b8f5c9" stop-opacity="0.9"/><stop offset="1" stop-color="#b8f5c9" stop-opacity="0"/></radialGradient><radialGradient id="glow-red"><stop offset="0" stop-color="#ffb3aa" stop-opacity="0.9"/><stop offset="1" stop-color="#ffb3aa" stop-opacity="0"/></radialGradient><radialGradient id="glow-moon"><stop offset="0" stop-color="#fffbe6" stop-opacity="0.9"/><stop offset="1" stop-color="#fffbe6" stop-opacity="0"/></radialGradient></defs><rect x="0.0" y="0.0" width="1800.0" height="850.0" rx="0" fill="#f7f4ec" opacity="1.0" /><text x="40.0" y="58.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" text-anchor="start" font-weight="bold" fill="#263238" opacity="1.0">The fade: from pictures to numerals to symbols</text><text x="40.0" y="92.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" font-weight="normal" fill="#4a5a60" opacity="1.0">The same order card grows up with the child; Hoot always reads it aloud, so a numeral is heard before it is read</text><rect x="60.0" y="140.0" width="380.0" height="360.0" rx="16" fill="#fffaf0" stroke="#c98a00" stroke-width="3" opacity="1.0" /><circle cx="250.0" cy="300.0" r="103.0" fill="#9a5f22" opacity="1.0"/><path d="M250.0,300.0 L250.0,200.0 A100.0,100.0 0 0,1 350.0,300.0 z" fill="#d99a4e" stroke="#9a5f22" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" /><path d="M250.0,300.0 L251.6,220.0 A80.0,80.0 0 0,1 330.0,298.4 z" fill="#ffcf4d" opacity="0.92" /><path d="M250.0,300.0 L350.0,300.0 A100.0,100.0 0 0,1 250.0,400.0 z" fill="#d99a4e" stroke="#9a5f22" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" /><path d="M250.0,300.0 L330.0,301.6 A80.0,80.0 0 0,1 251.6,380.0 z" fill="#ffcf4d" opacity="0.92" /><path d="M250.0,300.0 L250.0,400.0 A100.0,100.0 0 0,1 150.0,300.0 z" fill="#d99a4e" stroke="#9a5f22" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" /><path d="M250.0,300.0 L248.4,380.0 A80.0,80.0 0 0,1 170.0,301.6 z" fill="#ffcf4d" opacity="0.92" /><path d="M250.0,300.0 L150.0,300.0 A100.0,100.0 0 0,1 250.0,200.0 z" fill="#d99a4e" stroke="#9a5f22" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" /><path d="M250.0,300.0 L170.0,298.4 A80.0,80.0 0 0,1 248.4,220.0 z" fill="#c2415a" opacity="0.92" /><text x="250.0" y="484.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#4a5a60" font-style="italic" opacity="1.0">stage 1: pictures</text><rect x="480.0" y="140.0" width="380.0" height="360.0" rx="16" fill="#fffaf0" stroke="#c98a00" stroke-width="3" opacity="1.0" /><circle cx="600.0" cy="300.0" r="82.4" fill="#9a5f22" opacity="1.0"/><path d="M600.0,300.0 L600.0,220.0 A80.0,80.0 0 0,1 680.0,300.0 z" fill="#d99a4e" stroke="#9a5f22" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" /><path d="M600.0,300.0 L601.3,236.0 A64.0,64.0 0 0,1 664.0,298.7 z" fill="#ffcf4d" opacity="0.92" /><path d="M600.0,300.0 L680.0,300.0 A80.0,80.0 0 0,1 600.0,380.0 z" fill="#d99a4e" stroke="#9a5f22" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" /><path d="M600.0,300.0 L664.0,301.3 A64.0,64.0 0 0,1 601.3,364.0 z" fill="#ffcf4d" opacity="0.92" /><path d="M600.0,300.0 L600.0,380.0 A80.0,80.0 0 0,1 520.0,300.0 z" fill="#d99a4e" stroke="#9a5f22" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" /><path d="M600.0,300.0 L598.7,364.0 A64.0,64.0 0 0,1 536.0,301.3 z" fill="#ffcf4d" opacity="0.92" /><path d="M600.0,300.0 L520.0,300.0 A80.0,80.0 0 0,1 600.0,220.0 z" fill="#d99a4e" stroke="#9a5f22" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" /><path d="M600.0,300.0 L536.0,298.7 A64.0,64.0 0 0,1 598.7,236.0 z" fill="#c2415a" opacity="0.92" /><text x="770.0" y="320.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="64" text-anchor="middle" font-weight="bold" fill="#263238" opacity="1.0">3/4</text><text x="670.0" y="484.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#4a5a60" font-style="italic" opacity="1.0">stage 2: the picture and its numeral</text><rect x="900.0" y="140.0" width="380.0" height="360.0" rx="16" fill="#fffaf0" stroke="#c98a00" stroke-width="3" opacity="1.0" /><text x="1090.0" y="330.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="110" text-anchor="middle" font-weight="bold" fill="#263238" opacity="1.0">3/4</text><text x="1090.0" y="484.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#4a5a60" font-style="italic" opacity="1.0">stage 3: the numeral (heard too)</text><rect x="1320.0" y="140.0" width="420.0" height="360.0" rx="16" fill="#fffaf0" stroke="#c98a00" stroke-width="3" opacity="1.0" /><text x="1530.0" y="210.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" text-anchor="middle" font-weight="bold" fill="#263238" opacity="1.0">1/2 + 1/3</text><text x="1530.0" y="264.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" text-anchor="middle" font-weight="bold" fill="#263238" opacity="1.0">3 × 2/3</text><text x="1530.0" y="318.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" text-anchor="middle" font-weight="bold" fill="#263238" opacity="1.0">6 ÷ 3/4</text><text x="1530.0" y="372.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" text-anchor="middle" font-weight="bold" fill="#263238" opacity="1.0">2 : 1</text><text x="1530.0" y="426.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" text-anchor="middle" font-weight="bold" fill="#263238" opacity="1.0">0.75 = 75%</text><text x="1530.0" y="484.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#4a5a60" font-style="italic" opacity="1.0">stage 4: symbols (rungs 4-6)</text><line x1="450.0" y1="320.0" x2="468.0" y2="320.0" stroke="#9c7414" stroke-width="4" stroke-linecap="round" opacity="1.0" marker-end="url(#arrow-brass)"/><line x1="870.0" y1="320.0" x2="888.0" y2="320.0" stroke="#9c7414" stroke-width="4" stroke-linecap="round" opacity="1.0" marker-end="url(#arrow-brass)"/><line x1="1290.0" y1="320.0" x2="1308.0" y2="320.0" stroke="#9c7414" stroke-width="4" stroke-linecap="round" opacity="1.0" marker-end="url(#arrow-brass)"/><rect x="34.0" y="540.0" width="1732.0" height="280.0" rx="18" fill="#ffffff" stroke="#d0d8dc" stroke-width="2" opacity="0.95" /><text x="60.0" y="584.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" text-anchor="start" font-weight="bold" fill="#263238" opacity="1.0">How the voice carries the numerals (reading them is part of the skill at the top)</text><text x="60.0" y="624.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#263238" opacity="1.0">1.  Every order is spoken when the buddy arrives, in words: "Three quarters of a pie, please!" (never a written question).</text><text x="60.0" y="650.4" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#263238" opacity="1.0">2.  From stage 2 the card shows the numeral under the picture; a touch on it says it again; the knife's dots get numerals too.</text><text x="60.0" y="676.7" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#263238" opacity="1.0">3.  At stage 3 the picture is gone: the child acts on the numeral, still read aloud; the Fair Line's posts show 0, 1, 2 and the box's amount is said when it stops.</text><text x="60.0" y="703.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#263238" opacity="1.0">4.  At stage 4 (rungs 4-6) the cards carry the sums, products, divisions, ratios and percents the rooms play; every symbol says its name when touched ("plus", "times", "to").</text><text x="60.0" y="729.4" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#263238" opacity="1.0">5.  The grade sets the starting stage (3: pictures, 4: pictures and numerals, 5-6: numerals); three orders in a row right with no help move it on, two helped in a row move it back.</text><text x="60.0" y="755.8" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#263238" opacity="1.0">6.  On screen during play there are no words: only pictures and these numerals and symbols, which are the subject.</text><text x="60.0" y="782.1" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#263238" opacity="1.0">    Without a voice (Read to me off, or no English voice) Hoot's lines show as words (G0's ruling 28).</text></svg>