" y="482.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#52514e" opacity="1.0">0 %</text><text x="900.0" y="714.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#4a5a60" font-style="italic" opacity="1.0">From model/opening_night_model.py and model/midnight_model.py. Whole-number bias passes Opening Night because nothing there compares two amounts; Midnight is where it fails.</text><text x="900.0" y="738.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#4a5a60" font-style="italic" opacity="1.0">'Trial and error (undo)' is a knife we do not build: it shows why a cut is final. 'Always halves' knows sizes, so it passes Midnight; Opening Night's thirds and fifths stop it.</text></svg>