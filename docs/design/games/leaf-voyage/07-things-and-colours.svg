th d="M0,0 L10,5 L0,10 z" fill="#1f7fc4"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98300"/></marker><marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8790"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f8a36"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2453c"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b6bff"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker></defs><rect x="0.0" y="0.0" width="1700.0" height="1000.0" rx="0" fill="#f7f4ec" opacity="1.0" /><text x="40.0" y="58.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" text-anchor="start" font-weight="bold" fill="#263238" opacity="1.0">The look of things: one meaning, one colour, one shape, one sound</text><text x="40.0" y="92.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" font-weight="normal" fill="#4a5a60" opacity="1.0">Rungs 4-6 show a sign; rung 7 shows the truth underneath (atoms in their real counts)</text><text x="330.0" y="150.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#4a5a60" opacity="1.0">rungs 4-6</text><text x="720.0" y="150.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#4a5a60" opac