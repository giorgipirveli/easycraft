circle cx="742.5" cy="521.0" r="9.0" fill="#e2453c" stroke="#263238" stroke-width="2" opacity="1.0"/><line x1="742.5" y1="547.0" x2="762.5" y2="533.0" stroke="#c98300" stroke-width="4" stroke-linecap="round" opacity="1.0"/><circle cx="762.5" cy="533.0" r="8.0" fill="#2c2c2c" stroke="#263238" stroke-width="2" opacity="1.0"/><text x="980.0" y="540.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#263238" opacity="1.0">honey-gold hexagon that glows (stored light)</text><text x="1520.0" y="540.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="normal" fill="#4a5a60" font-style="italic" opacity="1.0">a ding; a chord</text><rect x="60.0" y="598.0" width="1580.0" height="96.0" rx="12" fill="#ffffff" opacity="1.0" /><text x="90.0" y="648.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" text-anchor="start" font-weight="bold" fill="#263238" opacity="1.0">light</text><path d="M330.0,620.0 L335.5,636.5 L352.0,642.0 L335.5,647.5 L330.0,664.0 L324.5,647.5 L308.0,642.0 L324.5,636.5 z" fill="#ffe27a" stroke="#e0a800" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" /><path d="M720.0,620.0 L725.5,636.5 L742.0,642.0 L725.5,647.5 L720.0,664.0 L714.5,647.5 L698.0,642.0 L714.5,636.5 z" fill="#ffe27a" stroke="#e0a800" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" /><text x="980.0" y="648.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#263238" opacity="1.0">gold sparks (energy is gold, never a thing)</text><text x="1520.0" y="648.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="normal" fill="#4a5a60" font-style="italic" opacity="1.0">a shimmer</text><rect x="60.0" y="706.0" width="1580.0" height="96.0" rx="12" fill="#f1f5f3" opacity="1.0" /><text x="90.0" y="756.0" font-family="DejaVu Sans, Arial,