.2 460.0)"/><line x1="910.0" y1="436.0" x2="910.0" y2="484.0" stroke="#0f3d2a" stroke-width="3" stroke-linecap="round" opacity="1.0"/><g transform="translate(780.0,400.0) rotate(70.0) scale(1.300)" opacity="1.0"><rect x="-22.0" y="-10.0" width="44.0" height="50.0" rx="14" fill="#ffd9b8" stroke="#263238" stroke-width="3" opacity="1.0" /><rect x="-24.0" y="-24.0" width="48.0" height="18.0" rx="9" fill="#ffd9b8" stroke="#263238" stroke-width="3" opacity="1.0" /><rect x="-26.0" y="36.0" width="52.0" height="18.0" rx="6" fill="#3a4a52" stroke="#263238" stroke-width="2.5" opacity="1.0" /></g><g transform="translate(1040.0,400.0) rotate(-70.0) scale(1.300)" opacity="1.0"><rect x="-22.0" y="-10.0" width="44.0" height="50.0" rx="14" fill="#ffd9b8" stroke="#263238" stroke-width="3" opacity="1.0" /><rect x="-24.0" y="-24.0" width="48.0" height="18.0" rx="9" fill="#ffd9b8" stroke="#263238" stroke-width="3" opacity="1.0" /><rect x="-26.0" y="36.0" width="52.0" height="18.0" rx="6" fill="#3a4a52" stroke="#263238" stroke-width="2.5" opacity="1.0" /></g><line x1="820.0" y1="330.0" x2="870.0" y2="360.0" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9" marker-end="url(#arrow-white)"/><line x1="1000.0" y1="330.0" x2="950.0" y2="360.0" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9" marker-end="url(#arrow-white)"/><path d="M910.0,500.0 C924.0,521.0 896.0,542.0 914.0,570.0" fill="none" stroke="#bfe8ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.25" /><path d="M910.0,500.0 C924.0,521.0 896.0,542.0 914.0,570.0" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.175" /><rect x="796.8" y="593.2" width="226.4" height="24.8" rx="12.32" fill="#2d5d4a" opacity="0.9" /><text x="910.0" y="611.6" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff" opacity="1.0">squeak... sigh: shut</text><rect x="791.8" y="1