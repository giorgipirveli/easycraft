<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760"><defs><radialGradient id="glow-gold"><stop offset="0" stop-color="#fff3b0" stop-opacity="0.95"/><stop offset="1" stop-color="#fff3b0" stop-opacity="0"/></radialGradient><radialGradient id="glow-green"><stop offset="0" stop-color="#b6ffb0" stop-opacity="0.9"/><stop offset="1" stop-color="#b6ffb0" stop-opacity="0"/></radialGradient><radialGradient id="glow-sun"><stop offset="0" stop-color="#fff6c9" stop-opacity="0.95"/><stop offset="1" stop-color="#fff6c9" stop-opacity="0"/></radialGradient><radialGradient id="glow-white"><stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient><linearGradient id="sky-hot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc75a"/><stop offset="1" stop-color="#fff0c2"/></linearGradient><linearGradient id="sky-eve" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f39a6b"/><stop offset="1" stop-color="#ffe3c8"/></linearGradient><linearGradient id="sky-day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ec5f0"/><stop offset="1" stop-color="#e9f3fb"/></linearGradient><linearGradient id="sky-night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1b45"/><stop offset="1" stop-color="#2c3f7a"/></linearGradient><linearGradient id="cave" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e5f8b0"/><stop offset="0.45" stop-color="#86d46f"/><stop offset="1" stop-color="#2d7a5c"/></linearGradient><linearGradient id="ray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbe0"/><stop offset="1" stop-color="#fffbe0"/></linearGradient><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#263238"/></marker><marker id="arrow-water" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7fc4"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98300"/></marker><marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8790"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f8a36"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2453c"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b6bff"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker></defs><rect x="0.0" y="0.0" width="1800.0" height="760.0" rx="0" fill="#f7f4ec" opacity="1.0" /><text x="40.0" y="58.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" text-anchor="start" font-weight="bold" fill="#263238" opacity="1.0">In VR the hands do the idea</text><text x="40.0" y="92.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" font-weight="normal" fill="#4a5a60" opacity="1.0">Swim through thick air (you stop when you stop), squeeze a door shut with both hands, carry sugar to the gold pipe</text><rect x="40.0" y="130.0" width="560.0" height="560.0" rx="20" fill="url(#cave)" stroke="#2d5d4a" stroke-width="3" opacity="1.0" /><path d="M267.4,300.0 Q267.4,300.0 261.1,321.1 Q254.8,342.3 231.6,355.1 Q208.4,368.0 180.6,366.6 Q152.7,365.3 130.0,353.2 Q107.2,341.1 98.8,320.6 Q90.4,300.0 98.3,279.2 Q106.3,258.4 128.9,245.1 Q151