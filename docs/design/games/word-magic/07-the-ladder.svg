786e" font-style="italic" opacity="1.0">transfer: 3.T2 The Picnic Notes</text><text x="900.0" y="1120.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#4a5a60" font-style="italic" opacity="1.0">* a reading room (opens at stage 2, when the child's own reading has lit enough words). Every transfer page is writing for someone: a buddy reads it and acts it out.</text><text x="900.0" y="1146.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#4a5a60" font-style="italic" opacity="1.0">36 units become P1 when their rooms ship (two more are open questions). Phase B: the First Page and the Sleepy Dragons; phase C1: floors 3-4; C2: floors 5-8.</text></svg>