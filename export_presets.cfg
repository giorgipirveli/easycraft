vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://web/shell.html"
html/head_include="<script>
/* EasyCraft (M7, owner 2026-09-27: open full screen like an installed game). Browsers only allow full screen after a
   tap or click, so the first one (usually PLAY) switches to full screen and turns phones to landscape; a player who
   leaves full screen gets it back on the next tap. Installed as an app it opens full screen by itself (the manifest).
   iPhone Safari has no full screen for pages: the start page (web/shell.html) shows how to add it to the Home Screen. */
(function () {
  var mm = function (q) { return window.matchMedia && window.matchMedia(q).matches; };
  var installed = mm('(display-mode: fullscreen)') || mm('(display-mode: standalone)') || navigator.standalone === true;
  var root = document.documentElement;
  var request = root.requestFullscreen || root.webkitRequestFullscreen;
  function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function goFull(e) {
    if (installed || !request || isFull() || (e && e.key === 'Escape')) { return; }
    if (e && e.target && e.target.closest && e.target.closest('#install, #guide')) { return; }
    try {
      var p = request.call(root, { navigationUI: 'hide' });
      if (p && p.then) {
        p.then(function () {
          if (screen.orientation && screen.orientation.lock) { screen.orientation.lock('landscape').catch(function () {}); }
        }).catch(function () {});
      }
    } catch (err) {}
  }
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(function (t) {
    window.addEventListener(t, goFull, { capture: true, passive: true });
  });
})();
</script>"
