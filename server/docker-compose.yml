# EasyCraft online backend for development: Nakama + PostgreSQL (spec §7.1).
# Start/stop/logs/reset: server/README.md. Other projects' containers run on this PC too, so this
# project always runs as compose project "easycraft" and only publishes Nakama's ports, bound to
# 127.0.0.1 (the Android emulator reaches them as 10.0.2.2).
name: easycraft

services:
  postgres:
    image: postgres:16.8-alpine        # the version Heroic Labs' docker-compose-postgres.yml pins
    container_name: easycraft-postgres
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb        # development only; the database is not published
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: "no"                     # shared PC: nothing starts at boot

  nakama:
    image: heroiclabs/nakama:3.41.0
    container_name: easycraft-nakama
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --config /nakama/data/local.yml
        --database.address postgres:localdb@postgres:5432/nakama ${NAKAMA_EXTRA_ARGS:-}
    volumes:
      - ./nakama/local.yml:/nakama/data/local.yml:ro
      - type: bind                     # build it first (server/dev.sh up does): npm run build
        source: ./modules/build
        target: /nakama/data/modules/build
        read_only: true
        bind:
          create_host_path: false      # else Docker makes a root-owned empty folder there
    ports:
      - "${NAKAMA_BIND:-127.0.0.1}:${NAKAMA_GRPC_PORT:-7349}:7349"      # gRPC API
      - "${NAKAMA_BIND:-127.0.0.1}:${NAKAMA_HTTP_PORT:-7350}:7350"      # HTTP API + realtime socket (the game)
      - "${NAKAMA_BIND:-127.0.0.1}:${NAKAMA_CONSOLE_PORT:-7351}:7351"   # developer console
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: on-failure:3            # not at boot (a shared PC); retries a crash

volumes:
  db:
